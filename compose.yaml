services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/travel_benefits
      NATS_URL: nats://nats:4222
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: travel_benefits
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d travel_benefits"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - travel-benefit-data:/var/lib/postgresql/data
  nats:
    image: nats:2.10-alpine
    command: ["-js"]
volumes:
  travel-benefit-data:
